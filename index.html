<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lee Dell Bay Innovations</title>
<meta name="description" content="Apps and games from Lee Dell Bay Innovations LLC.">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1b1f27;
    --muted: #4b5563;
    --accent: #1d4ed8;
    --line: #d9dde4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --card: #1d2128;
      --text: #eef0f4;
      --muted: #b4bbc7;
      --accent: #8ab4ff;
      --line: #313743;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 0; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 32px; }
  .app {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
  }
  .app h2 { font-size: 1.2rem; margin: 0 0 6px; }
  .app p { margin: 0 0 14px; color: var(--muted); }
  a { color: var(--accent); }
  .links a { margin-right: 16px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <h1>Lee Dell Bay Innovations</h1>
  <p class="tagline">Apps and games.</p>

  <section class="app">
    <h2>Tic Tac Duel: Marks</h2>
    <p>Tic-tac-toe, your way. Play a friend on one device or take on the computer at three difficulty levels.</p>
    <div class="links">
      <a href="https://apps.apple.com/app/id6821406793">App Store</a>
      <a href="https://leedellbay.github.io/tic-tac-duel-privacy-policy/">Privacy policy and support</a>
    </div>
  </section>

  <footer>&copy; 2026 Lee Dell Bay Innovations LLC</footer>
</main>
</body>
</html>
